services:
  postgres:
    image: postgres:16-alpine
    container_name: habit_postgres
    environment:
      POSTGRES_DB: habitdb
      POSTGRES_USER: habituser
      POSTGRES_PASSWORD: habitpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habituser -d habitdb"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: habit_backend
    env_file:
      - ./back/.env
    ports:
      - "3333:3333"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "node ace migration:run && node ace serve --watch"

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: habit_frontend
    environment:
      - VITE_API_URL=http://localhost:3333
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: sh -c "npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  pgdata:
