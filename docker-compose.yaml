services:
  postgres:
    image: postgres:16-alpine
    container_name: habit_postgres
    environment:
      POSTGRES_DB: habitdb
      POSTGRES_USER: habituser
      POSTGRES_PASSWORD: habitpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habituser -d habitdb"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: habit_backend
    env_file:
      - ./back/.env
    ports:
      - "3333:3333"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./back:/app
      - back_node_modules:/app/node_modules
    environment:
      # rend le watch fiable sous Docker (surtout Windows/Mac)
      - CHOKIDAR_USEPOLLING=1
      - CHOKIDAR_INTERVAL=100
    command: sh -c "node ace migration:run && node ace serve --watch"

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: habit_frontend
    environment:
      - VITE_API_URL=http://localhost:3333
      # watch fiable sous Docker (surtout Windows/Mac)
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - VITE_HMR_HOST=localhost
      - VITE_HMR_PORT=5173
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./front:/app
      - front_node_modules:/app/node_modules
    command: sh -c "npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  pgdata:
  back_node_modules:
  front_node_modules:
