name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, test, build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: habitdb
          POSTGRES_USER: habituser
          POSTGRES_PASSWORD: habitpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U habituser -d habitdb"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    defaults:
      run:
        working-directory: back

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            back/package-lock.json
            front/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run migrations
        env:
          NODE_ENV: test
          # Adonis (PG) — adapte si tes noms diffèrent
          DB_CONNECTION: pg
          PG_HOST: 127.0.0.1
          PG_PORT: 5432
          PG_USER: habituser
          PG_PASSWORD: habitpass
          PG_DB_NAME: habitdb
          # requis Adonis
          APP_KEY: ${{ secrets.APP_KEY || '0123456789abcdef0123456789abcdef' }}
        run: node ace migration:run --force

      - name: Tests
        env:
          NODE_ENV: test
          DB_CONNECTION: pg
          PG_HOST: 127.0.0.1
          PG_PORT: 5432
          PG_USER: habituser
          PG_PASSWORD: habitpass
          PG_DB_NAME: habitdb
          APP_KEY: ${{ secrets.APP_KEY || '0123456789abcdef0123456789abcdef' }}
        run: node ace test

      - name: Build
        run: npm run build

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: front

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            front/package-lock.json
            back/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          VITE_API_URL: http://localhost:3333
        run: npm run build
